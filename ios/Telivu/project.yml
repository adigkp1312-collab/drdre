name: Telivu

options:
  bundleIdPrefix: com.telivu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Telivu:
    type: application
    platform: iOS
    sources:
      - path: Telivu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.telivu.demo
        PRODUCT_NAME: Telivu
        INFOPLIST_KEY_CFBundleDisplayName: Telivu
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    info:
      path: Telivu/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Telivu uses the camera only when you choose to scan a report page.
        NSPhotoLibraryUsageDescription: Telivu lets you choose a report image you want to review.
        NSMicrophoneUsageDescription: Telivu uses the microphone only after you tap Speak for a short command.
