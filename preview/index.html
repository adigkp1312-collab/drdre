<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F7" />
    <meta name="description" content="Telivu voice-first health companion interface preview." />
    <title>Telivu — Voice First</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-card" aria-labelledby="screen-title">
      <p class="eyebrow">Start with what you notice</p>

      <section class="voice-map" id="voice-map" aria-label="Telivu is ready to listen">
        <svg class="scene" viewBox="0 0 318 215" role="img" aria-labelledby="scene-title scene-description">
          <title id="scene-title">Telivu voice companion</title>
          <desc id="scene-description">A calm face, voice signal, and document connected in a monochrome space.</desc>
          <defs>
            <radialGradient id="avatar-tone" cx="38%" cy="30%" r="76%">
              <stop offset="0" stop-color="#f7f7f7" stop-opacity=".9" />
              <stop offset=".58" stop-color="#f7f7f7" stop-opacity=".55" />
              <stop offset="1" stop-color="#000000" stop-opacity=".55" />
            </radialGradient>
            <radialGradient id="companion-glow" cx="100%" cy="50%" r="70%">
              <stop offset="0" stop-color="#f7f7f7" />
              <stop offset=".48" stop-color="#f7f7f7" />
              <stop offset=".78" stop-color="#f7f7f7" stop-opacity=".18" />
              <stop offset="1" stop-color="#f7f7f7" stop-opacity="0" />
            </radialGradient>
            <filter id="scene-grain" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency=".13" numOctaves="3" seed="17" result="noise" />
              <feBlend in="SourceGraphic" in2="noise" mode="soft-light" />
            </filter>
            <clipPath id="face-clip"><circle cx="155" cy="191" r="51" /></clipPath>
          </defs>

          <rect width="318" height="215" fill="#5e5e5e" />
          <rect width="318" height="215" fill="#000000" opacity=".38" />

          <g class="stars" fill="#f7f7f7" opacity=".42">
            <circle cx="36" cy="10" r=".8" /><circle cx="110" cy="13" r=".6" />
            <circle cx="172" cy="20" r=".8" /><circle cx="233" cy="11" r=".6" />
            <circle cx="282" cy="30" r=".7" /><circle cx="210" cy="67" r=".6" />
            <circle cx="36" cy="69" r=".6" /><circle cx="104" cy="89" r=".7" />
            <circle cx="270" cy="89" r=".7" /><circle cx="74" cy="121" r=".7" />
            <circle cx="249" cy="144" r=".6" /><circle cx="25" cy="168" r=".7" />
          </g>

          <circle cx="342" cy="107" r="108" fill="url(#companion-glow)" />
          <circle cx="345" cy="107" r="70" fill="#f7f7f7" />
          <path d="M279 95q15-13 31 0M282 106h12M304 106h12M298 104l-2 18 7 3M287 137q12 8 24 0" fill="none" stroke="#000" stroke-width="1.4" />

          <g class="voice-source" transform="translate(49 100) rotate(-14)">
            <ellipse rx="45" ry="37" fill="url(#avatar-tone)" opacity=".55" />
            <ellipse class="signal-ring signal-ring-a" rx="78" ry="10" fill="none" stroke="#f7f7f7" stroke-width="1.2" />
            <ellipse class="signal-ring signal-ring-b" rx="68" ry="7" fill="none" stroke="#f7f7f7" stroke-width=".7" stroke-dasharray="3 5" />
            <g class="voice-bars" fill="#f7f7f7" transform="rotate(14) translate(-17 -18)">
              <rect x="0" y="12" width="3" height="12" /><rect x="8" y="7" width="3" height="22" />
              <rect x="16" y="1" width="3" height="34" /><rect x="24" y="9" width="3" height="18" />
              <rect x="32" y="5" width="3" height="26" />
            </g>
          </g>

          <path d="M80 112 142 167M142 167l109-17" fill="none" stroke="#f7f7f7" stroke-width="1" opacity=".44" />
          <path d="M82 115q78-27 165 28" fill="none" stroke="#f7f7f7" stroke-width="1" stroke-dasharray="3 5" opacity=".34" />

          <circle cx="155" cy="191" r="51" fill="url(#avatar-tone)" stroke="#f7f7f7" stroke-width="1.7" opacity=".9" />
          <g clip-path="url(#face-clip)" filter="url(#scene-grain)" fill="none" stroke="#f7f7f7" stroke-width="1.5" opacity=".7">
            <path d="M119 180q16-19 28-9t17 3q12-6 27 8t8 25q-20 11-26-2t-18-3q-18 12-24 1t-12-23z" />
            <path d="M150 153q3 11-7 14t-14-5m54 4q-12 8-8 18t-10 11" />
          </g>
        </svg>

        <span class="tag tag-light voice-tag">Your voice</span>
        <span class="map-intro">with</span>
        <span class="tag tag-dark telivu-tag">Telivu</span>
        <span class="tag you-tag">You</span>
        <span class="map-status" id="map-status"><i></i>Ready</span>
      </section>

      <section class="story" aria-label="Ways to start">
        <button class="story-row talk-row" id="talk-button" type="button" aria-pressed="false" aria-label="Tap to talk">
          <span class="icon-cell voice-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="28" fill="#5e5e5e" opacity=".07" />
              <circle cx="32" cy="32" r="21" fill="#f7f7f7" stroke="#5e5e5e" stroke-width=".7" />
              <path d="M27 20h10v18H27zM23 34v1c0 6 4 10 9 10s9-4 9-10v-1M32 45v7M27 52h10" fill="none" stroke="#000" stroke-width="1.3" />
            </svg>
          </span>
          <span class="copy-row">
            <h1 id="screen-title">Tell me what’s going on.</h1>
            <span class="label" id="talk-label">Your voice</span>
          </span>
        </button>

        <div class="story-row attachment-row">
          <span class="icon-cell report-icon" aria-hidden="true">
            <svg viewBox="0 0 54 54">
              <path d="M8 6v41h42" fill="none" stroke="#5e5e5e" stroke-width="1" opacity=".65" />
              <path d="M10 12q10 22 35 30" fill="none" stroke="#5e5e5e" stroke-width="1" stroke-dasharray="3 4" opacity=".65" />
              <rect x="22" y="14" width="23" height="28" fill="#f7f7f7" stroke="#5e5e5e" stroke-width=".8" />
              <path d="M27 23h13M27 28h13M27 33h9" stroke="#5e5e5e" stroke-width=".8" />
            </svg>
          </span>
          <span class="copy-row">
            <span class="story-line">or show me what you see.</span>
            <span class="attachment-actions">
              <button class="label label-dark" id="add-image" type="button">Add image</button>
              <button class="label label-quiet" id="add-file" type="button">Add file</button>
            </span>
          </span>
        </div>

        <div class="story-row companion-row">
          <span class="icon-cell companion-icon" aria-hidden="true">
            <svg viewBox="0 0 70 46">
              <g transform="translate(34 23) rotate(-13)">
                <circle r="12" fill="#5e5e5e" opacity=".22" />
                <ellipse rx="28" ry="5" fill="none" stroke="#5e5e5e" stroke-width="2" />
                <ellipse rx="28" ry="5" fill="none" stroke="#f7f7f7" stroke-width=".7" />
              </g>
            </svg>
          </span>
          <span class="copy-row">
            <span class="story-line" id="response-copy">Take your time. I’m ready.</span>
            <span class="label label-muted">Plain English</span>
          </span>
        </div>

        <div class="divider"></div>
      </section>

      <p class="footer-copy">Speak naturally. Add a photo or report only if it helps.</p>
      <p class="safety-copy">Telivu is not for diagnosis or emergencies.</p>

      <div class="progress" aria-hidden="true"></div>
      <button class="rail-control" id="rail-control" type="button" aria-label="Tap to talk">
        <svg viewBox="0 0 44 38" aria-hidden="true">
          <g class="rail-wings" fill="#5e5e5e" stroke="#000" stroke-width=".55">
            <path d="M21 16C17 4 8 2 3 6c3 7 7 13 17 15-8-1-13 3-13 10 7 0 12-3 15-9z" />
            <path d="M23 16C27 4 36 2 41 6c-3 7-7 13-17 15 8-1 13 3 13 10-7 0-12-3-15-9z" />
          </g>
          <path d="M19 10h6v12h-6zM16 19v1c0 4 3 7 6 7s6-3 6-7v-1M22 27v6" fill="none" stroke="#000" stroke-width="1.15" />
        </svg>
      </button>

      <input class="visually-hidden" id="image-input" type="file" accept="image/*" tabindex="-1" />
      <input class="visually-hidden" id="file-input" type="file" accept="image/*,.pdf" tabindex="-1" />
      <div class="selection-notice" id="selection-notice" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
